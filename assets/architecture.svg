<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f7f9fb"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">Interview Coach — Architecture</text>

  <!-- Knowledge base -->
  <rect x="40" y="65" width="200" height="55" rx="8" fill="#e8f0fe" stroke="#4285c9" stroke-width="1.5"/>
  <text x="140" y="97" text-anchor="middle" font-size="13" fill="#1f2d3d">Question Bank (.md)</text>

  <!-- Chunking -->
  <rect x="40" y="150" width="200" height="55" rx="8" fill="#e8f0fe" stroke="#4285c9" stroke-width="1.5"/>
  <text x="140" y="182" text-anchor="middle" font-size="13" fill="#1f2d3d">Chunking (LlamaIndex)</text>

  <!-- Embedding -->
  <rect x="40" y="235" width="200" height="55" rx="8" fill="#e8f0fe" stroke="#4285c9" stroke-width="1.5"/>
  <text x="140" y="260" text-anchor="middle" font-size="13" fill="#1f2d3d">Embeddings</text>
  <text x="140" y="277" text-anchor="middle" font-size="11" fill="#5b6b7c">(Jina v3)</text>

  <!-- Qdrant -->
  <rect x="40" y="320" width="200" height="55" rx="8" fill="#eafaf1" stroke="#2fa86a" stroke-width="1.5"/>
  <text x="140" y="345" text-anchor="middle" font-size="13" fill="#1f2d3d">Qdrant Cloud</text>
  <text x="140" y="362" text-anchor="middle" font-size="11" fill="#5b6b7c">vector store</text>

  <!-- Rerank -->
  <rect x="40" y="405" width="200" height="55" rx="8" fill="#eafaf1" stroke="#2fa86a" stroke-width="1.5"/>
  <text x="140" y="430" text-anchor="middle" font-size="13" fill="#1f2d3d">Reranker</text>
  <text x="140" y="447" text-anchor="middle" font-size="11" fill="#5b6b7c">(Jina cross-encoder)</text>

  <!-- vertical connecting arrows on left column -->
  <line x1="140" y1="120" x2="140" y2="150" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="205" x2="140" y2="235" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="290" x2="140" y2="320" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="375" x2="140" y2="405" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow into LangGraph box -->
  <line x1="240" y1="432" x2="330" y2="330" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LangGraph state machine container -->
  <rect x="330" y="65" width="530" height="480" rx="10" fill="#fff" stroke="#8a5cf6" stroke-width="2"/>
  <text x="595" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#5b2ea6">LangGraph State Machine</text>

  <!-- select_topic -->
  <rect x="360" y="115" width="180" height="50" rx="8" fill="#f3ecfd" stroke="#8a5cf6" stroke-width="1.5"/>
  <text x="450" y="137" text-anchor="middle" font-size="12" fill="#1f2d3d">select_topic</text>
  <text x="450" y="152" text-anchor="middle" font-size="10" fill="#5b2ea6">⏸ human pause</text>

  <!-- ask_question -->
  <rect x="360" y="190" width="180" height="50" rx="8" fill="#fff2e0" stroke="#e0922f" stroke-width="1.5"/>
  <text x="450" y="212" text-anchor="middle" font-size="12" fill="#1f2d3d">ask_question</text>
  <text x="450" y="227" text-anchor="middle" font-size="10" fill="#a5651a">CrewAI: Interviewer</text>

  <!-- collect_answer -->
  <rect x="360" y="265" width="180" height="50" rx="8" fill="#f3ecfd" stroke="#8a5cf6" stroke-width="1.5"/>
  <text x="450" y="287" text-anchor="middle" font-size="12" fill="#1f2d3d">collect_answer</text>
  <text x="450" y="302" text-anchor="middle" font-size="10" fill="#5b2ea6">⏸ human pause</text>

  <!-- evaluate -->
  <rect x="360" y="340" width="180" height="50" rx="8" fill="#fff2e0" stroke="#e0922f" stroke-width="1.5"/>
  <text x="450" y="362" text-anchor="middle" font-size="12" fill="#1f2d3d">evaluate</text>
  <text x="450" y="377" text-anchor="middle" font-size="10" fill="#a5651a">CrewAI: Evaluator (Pydantic)</text>

  <!-- coach -->
  <rect x="360" y="415" width="180" height="50" rx="8" fill="#fff2e0" stroke="#e0922f" stroke-width="1.5"/>
  <text x="450" y="437" text-anchor="middle" font-size="12" fill="#1f2d3d">coach</text>
  <text x="450" y="452" text-anchor="middle" font-size="10" fill="#a5651a">CrewAI: Coach</text>

  <!-- vertical arrows inside graph box -->
  <line x1="450" y1="165" x2="450" y2="190" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="240" x2="450" y2="265" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="315" x2="450" y2="340" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="390" x2="450" y2="415" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- loop back arrow -->
  <path d="M540,440 C 700,440 700,140 540,140" fill="none" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="290" text-anchor="middle" font-size="11" fill="#5b6b7c" transform="rotate(90 700,290)">continue → next round</text>

  <!-- end box -->
  <rect x="600" y="415" width="180" height="50" rx="8" fill="#fdeaea" stroke="#d9534f" stroke-width="1.5"/>
  <text x="690" y="437" text-anchor="middle" font-size="12" fill="#1f2d3d">END session</text>
  <text x="690" y="452" text-anchor="middle" font-size="10" fill="#a5342f">→ session_log.json</text>
  <line x1="540" y1="440" x2="600" y2="440" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom: eval pipeline -->
  <rect x="330" y="565" width="530" height="1" fill="none"/>
  <line x1="690" y1="465" x2="690" y2="500" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="590" y="500" width="200" height="50" rx="8" fill="#fdeaea" stroke="#d9534f" stroke-width="1.5"/>
  <text x="690" y="520" text-anchor="middle" font-size="12" fill="#1f2d3d">RAGAS Evaluation</text>
  <text x="690" y="536" text-anchor="middle" font-size="10" fill="#a5342f">via LLM Gateway</text>

  <!-- Legend -->
  <rect x="40" y="500" width="14" height="14" fill="#f3ecfd" stroke="#8a5cf6"/>
  <text x="60" y="511" font-size="11" fill="#5b6b7c">Human-in-the-loop pause</text>
  <rect x="40" y="522" width="14" height="14" fill="#fff2e0" stroke="#e0922f"/>
  <text x="60" y="533" font-size="11" fill="#5b6b7c">CrewAI agent node</text>
  <rect x="40" y="544" width="14" height="14" fill="#fdeaea" stroke="#d9534f"/>
  <text x="60" y="555" font-size="11" fill="#5b6b7c">Terminal / eval step</text>
</svg>
